name: Generate Partner Operations Dashboard

on:
  push:
    branches:
      - main
  schedule:
    # Runs every day at 5:00 PM UTC (8:00 PM EAT)
    - cron: '0 17 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Install required Python packages
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      # 4. Run the Python script (Headless mode without server)
      - name: Run Dashboard Script
        run: |
          python -c "
          import Partner_Pulse
          Partner_Pulse.SERVE = False
          Partner_Pulse.OPEN_BROWSER = False
          Partner_Pulse.main()
          "

      # 5. Commit and push the updated index.html back to main
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html pending_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update dashboard via GitHub Action" && git push)