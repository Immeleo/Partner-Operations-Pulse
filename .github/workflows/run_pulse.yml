name: Auto-update Dashboards

on:
  push:
    paths:
      - 'Pending_Tickets.xlsx'
      - 'Closed_Tickets.xlsx'
      - '*.py'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas openpyxl

      - name: Run Partner Pulse Script
        run: python Partner_Pulse.py

      - name: Run Management Report Script
        run: python Management_Pulse.py  # Change to match your second script name

      - name: Commit and Push Generated Outputs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html partner_pulse.html management.html pending_history.json
          git commit -m "Auto-update reports and portal landing page" || exit 0
          git push